# Docker can assign a new IP when maple-api is recreated during deployment.
# Refresh its DNS record instead of keeping the address from Nginx startup.
upstream maple_api {
    zone maple_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server maple-api:3001 resolve;
}

server {
    listen 80;
    server_name em.redly.com.ar www.em.redly.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://maple_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
