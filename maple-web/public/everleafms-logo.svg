<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">EverleafMs V83 Classic</title>
  <desc id="desc">EverleafMs wordmark in forest green and warm gold with leaf details.</desc>
