version: '3'
services:
  maplestory:
    build: .
    depends_on:
      db:
        condition: service_started
      everlaf-reset:
        condition: service_completed_successfully
    ports:
      # Login server
      - "8484:8484"
      # Channels.
      # Format: WWCC, where WW is 75 plus the world number and CC is 75 plus the channel number (both zero indexed).
      # In this case, world 1 channels 1-3.
      - "7575-7577:7575-7577"
    volumes:
      # Keep the repository config as a read-only base. The container generates
      # /opt/server/config.yaml with Everlaf identity/rates on every startup.
      - ./config.yaml:/opt/server/config.base.yaml:ro
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
    environment:
      DB_HOST: "db" ## Remember if this is present it will OVERRIDE the host in the config.yaml, if you put here anything other than db, you'll need to change the config.yaml jdbc string to port 3307, and not port 3306

  # One-time Everlaf MS launch wipe.
  # The SQL stores a marker in MySQL, so future redeploys do NOT wipe players again.
  everlaf-reset:
    image: mysql:8.4.0
    depends_on:
      - db
    volumes:
      - ./tools/everlaf-reset.sql:/everlaf-reset.sql:ro
    command:
      - sh
      - -c
      - >-
        until mysqladmin ping -h db -uroot --silent; do
          echo '[Everlaf] waiting for MySQL...';
          sleep 2;
        done;
        echo '[Everlaf] checking one-time player wipe...';
        mysql -h db -uroot cosmic < /everlaf-reset.sql;
        echo '[Everlaf] reset check completed.'
    restart: "no"

  db:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "3307:3306"
    volumes:
      - ./database/docker-db-data:/var/lib/mysql
