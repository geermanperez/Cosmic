services:
  maplestory:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - everlaf-reset
    ports:
      - "8484:8484"
      - "7575:7575"
      - "7576:7576"
      - "7577:7577"
      - "7578:7578"
      - "7579:7579"
      - "7580:7580"
    volumes:
      # Preserve the EasyPanel/VPS configuration as the source of truth.
      # everlaf-start.sh copies it to config.yaml and changes ONLY identity/global rates.
      - ./config.yaml:/opt/server/config.base.yaml:ro
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      - everlaf-state:/everlaf-state
    environment:
      DB_HOST: "db"

  # Protected one-time Everlaf MS player reset.
  # It wipes accounts/characters and player-owned runtime data only.
  # Static drops, mobs, PQ scripts, commands, WZ/maps and custom content remain untouched.
  # The SQL stores a DB marker so future redeploys cannot wipe players again.
  everlaf-reset:
    image: mysql:8.4.0
    depends_on:
      - db
    restart: "no"
    volumes:
      - ./tools/everlaf-reset.sql:/everlaf-reset.sql:ro
      - everlaf-state:/everlaf-state
    command:
      - sh
      - -c
      - |
        until mysqladmin ping -h db -uroot --silent; do
          echo '[Everlaf] waiting for MySQL...'
          sleep 2
        done
        echo '[Everlaf] MySQL is online.'
        HAS_ACCOUNTS=$$(mysql -N -s -h db -uroot -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='cosmic' AND TABLE_NAME='accounts';")
        if [ "$$HAS_ACCOUNTS" = "0" ]; then
          echo '[Everlaf] Fresh database detected: no legacy players exist to wipe.'
          touch /everlaf-state/reset.done
          exit 0
        fi
        echo '[Everlaf] Existing schema detected. Running protected launch wipe...'
        if mysql -h db -uroot cosmic < /everlaf-reset.sql; then
          echo '[Everlaf] Player reset completed/verified.'
          touch /everlaf-state/reset.done
        else
          echo '[Everlaf] ERROR: reset failed; MapleStory startup remains blocked.' >&2
          exit 1
        fi

  db:
    image: mysql:8.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - cosmic-db-data:/var/lib/mysql

  maple-api:
    build: ./maple-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "cosmic"
      GTOP100_PINGBACK_KEY: "LatinMS2026GTop100Reward9472"
      VOTE_BASE_NX: "2000"
      VOTE_WEEKLY_BONUS_NX: "1000"
      VOTE_MONTHLY_BONUS_NX: "5000"
      PUBLIC_SITE_URL: "https://em.redly.com.ar"
      FRONTEND_URL: "https://em.redly.com.ar"
      PASSWORD_RESET_EXPIRES_MINUTES: "30"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""

  maple-web:
    build: ./maple-web
    restart: unless-stopped
    depends_on:
      - maple-api
    ports:
      - "8080:80"

volumes:
  cosmic-db-data:
  everlaf-state:
