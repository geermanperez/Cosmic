services:
  maplestory:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8484:8484"
      - "7575:7575"
      - "7576:7576"
      - "7577:7577"
      - "7578:7578"
      - "7579:7579"
      - "7580:7580"
    volumes:
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
    environment:
      DB_HOST: "db"

  db:
    image: mysql:8.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - cosmic-db-data:/var/lib/mysql

  maple-api:
    build: ./maple-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "cosmic"
      GTOP100_PINGBACK_KEY: "LatinMS2026GTop100Reward9472"
      VOTE_BASE_NX: "2000"
      VOTE_WEEKLY_BONUS_NX: "1000"
      VOTE_MONTHLY_BONUS_NX: "5000"
      PUBLIC_SITE_URL: "https://latinms.redly.com.ar"
      PASSWORD_RESET_EXPIRES_MINUTES: "30"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""

  maple-web:
    build: ./maple-web
    restart: unless-stopped
    depends_on:
      - maple-api
    ports:
      - "8080:80"

volumes:
  cosmic-db-data:
