services:
  maplestory:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8484:8484"
      - "7575-7577:7575-7577"
    volumes:
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
    environment:
      DB_HOST: "db"

  db:
    image: mysql:8.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - cosmic-db-data:/var/lib/mysql

  maple-api:
    build: ./maple-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "cosmic"

volumes:
  cosmic-db-data:
