services:
  maplestory:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8484:8484"
      - "7575:7575"
      - "7576:7576"
      - "7577:7577"
      - "7578:7578"
      - "7579:7579"
      - "7580:7580"
    volumes:
      # Preserve the EasyPanel/VPS configuration as the source of truth.
      # everlaf-start.sh copies it to config.yaml and changes ONLY identity/global rates.
      - ./config.yaml:/opt/server/config.base.yaml:ro
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      - everlaf-state:/everlaf-state
    environment:
      DB_HOST: "db"
      # Temporary login investigation; set to "false" when finished.
      LATINMS_LOGIN_DIAGNOSTICS: "true"

  # Everlaf MS player reset:
  # DISABLED: Launch wipe was already executed and verified (67 accounts / 80 characters active).
  # Kept disabled to eliminate any operational risk of accidental player wipe on redeploys.
  # everlaf-reset:
  #   image: mysql:8.4.0
  #   depends_on:
  #     - db
  #   restart: "no"
  #   volumes:
  #     - ./tools/everlaf-reset.sql:/everlaf-reset.sql:ro
  #     - everlaf-state:/everlaf-state

  db:
    image: mysql:8.4.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "cosmic", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - cosmic-db-data:/var/lib/mysql

  maple-api:
    build: ./maple-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: ""
      DB_NAME: "cosmic"
      GTOP100_PINGBACK_KEY: "LatinMS2026GTop100Reward9472"
      VOTE_BASE_NX: "2000"
      VOTE_WEEKLY_BONUS_NX: "1000"
      VOTE_MONTHLY_BONUS_NX: "5000"
      PUBLIC_SITE_URL: "https://em.redly.com.ar"
      FRONTEND_URL: "https://em.redly.com.ar"
      PASSWORD_RESET_EXPIRES_MINUTES: "30"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""

  maple-web:
    build: ./maple-web
    restart: unless-stopped
    depends_on:
      - maple-api
    ports:
      - "8080:80"

volumes:
  cosmic-db-data:
  everlaf-state:
